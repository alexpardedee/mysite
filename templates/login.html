<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Support HQ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            overflow-x: hidden;
        }
        .text-brand {
            color: #10b981; /* Emerald 500 */
        }
        .bg-brand {
            background-color: #10b981;
        }
        .btn-brand {
            background-color: #10b981;
            border-color: #10b981;
            font-size: 1.1rem;
            color: #0f172a;
            font-weight: 700;
        }
        .btn-brand:hover {
            background-color: #059669; /* Emerald 600 */
            border-color: #059669;
            color: white;
        }
        .form-control {
            background-color: #1e293b; /* Slate 800 */
            color: #f8fafc;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155; /* Slate 700 */
        }
        .form-control::placeholder {
            color: #64748b; /* Slate 500 */
        }
        .form-control:focus {
            background-color: #1e293b;
            color: #f8fafc;
            border-color: #10b981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.25);
        }
        
        /* HACK: Cegah autofill Chrome mengubah background jadi putih/kuning */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .big-heading {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.04em;
            color: #ffffff;
        }
        .collage-wrapper {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 50%;
            height: 75%;
            /* Menggunakan logo custom dari folder static Flask */
            background-image: url("{{ url_for('static', filename='logo_alex.png') }}"); 
            background-size: contain; /* Agar logo tampil penuh tidak terpotong */
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-color: rgba(15, 23, 42, 0.4); /* Memberi latar belakang tipis jika logo transparan */
        }
        .footer-links a {
            color: #94a3b8; /* Slate 400 */
            text-decoration: none;
            font-size: 0.75rem;
            margin-right: 15px;
        }
        .footer-links a:hover {
            text-decoration: underline;
            color: #10b981;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- MAIN LAYOUT -->
    <div class="row g-0 flex-grow-1">
        
        <!-- LEFT SIDE (Graphic & Text) -->
        <div class="col-lg-7 d-none d-lg-block position-relative p-5" style="background-color: #0f172a;">
            <!-- Logo Icon -->
            <div class="mb-5 mt-2 ms-4 d-flex align-items-center">
                <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-brand shadow" style="width: 56px; height: 56px; font-size: 1.8rem; color: #0f172a;">
                    <i class="fa-solid fa-server"></i>
                </div>
                <span class="ms-3 fw-bold fs-4 text-white">Alex <span class="text-brand">Site</span></span>
            </div>

            <!-- Main Headline -->
            <div class="ms-4 mt-5 pt-4">
                <h1 class="big-heading">
                    Manage<br>
                    Assets &<br>
                    Schedule<br>
                    <span class="text-brand">seamlessly.</span>
                </h1>
            </div>

            <!-- Image Collage Area (Logo Custom Opung) -->
            <div class="collage-wrapper d-none d-xl-block"></div>
        </div>

        <!-- RIGHT SIDE (Login Form) -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center" style="background-color: #1e293b; border-left: 1px solid #334155;">
            
            <div style="width: 100%; max-width: 380px;" class="p-4 rounded-4 shadow-lg" style="background-color: #0f172a; border: 1px solid #334155;">
                
                <h5 class="fw-bold mb-4 text-white text-center">Log in to Dashboard</h5>

                <!-- Pesan Error Jinja2 -->
                {% if error %}
                <div class="alert alert-danger py-2 rounded-3 small fw-bold text-center" style="background-color: rgba(220, 53, 69, 0.1); border-color: #dc3545; color: #ff6b6b;">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold" style="color: #94a3b8;">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Masukkan username..." required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold" style="color: #94a3b8;">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Masukkan password..." required>
                    </div>
                    
                    <button type="submit" class="btn btn-brand w-100 py-2.5 rounded-pill shadow">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log in
                    </button>
                </form>

                <hr class="my-4" style="border-color: #334155;">

                <div class="text-center">
                    <p class="small mb-0" style="color: #94a3b8;"><i class="fa-solid fa-shield-halved me-1 text-brand"></i> Secure Internal System</p>
                </div>
            </div>

        </div>

    </div>

    <!-- BOTTOM FOOTER -->
    <footer class="py-3 mt-auto" style="background-color: #0f172a; border-top: 1px solid #334155;">
        <div class="container-fluid px-4 px-lg-5">
            <div class="footer-links text-center text-lg-start d-flex justify-content-between align-items-center">
                <div>
                    <span class="fw-bold text-white me-3">Alex Site</span>
                    <a href="#">Helpdesk</a>
                    <a href="#">Report Issue</a>
                    <a href="#">System Status</a>
                </div>
                <div class="small" style="color: #64748b;">
                    &copy; 2026 PT Sebastian Jaya Metal. All rights reserved.
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
