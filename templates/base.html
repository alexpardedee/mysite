<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Site</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CDN untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* =========================================
           PALET WARNA: CLEAN DARK (Kontras Tegas & Jernih)
           ========================================= */
        :root {
            --bg-body: #111827;       /* Hitam kebiruan yang sangat solid */
            --bg-panel: #1f2937;      /* Abu-abu gelap elegan untuk card */
            --border-color: #374151;  /* Garis batas tegas tapi tidak silau */
            
            --text-main: #f9fafb;     /* Putih terang untuk teks utama */
            --text-muted: #d1d5db;    /* Abu-abu terang agar teks kecil terbaca jelas */
            
            --accent-blue: #38bdf8;   /* Biru terang */
            --accent-green: #34d399;  /* Hijau terang */
            --accent-purple: #c084fc; /* Ungu terang */
            --accent-yellow: #facc15; /* Kuning terang */
        }

        /* =========================================
           GLOBAL OVERRIDES (Memastikan tidak ada teks pudar)
           ========================================= */
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* Paksa semua teks agar kontrasnya tinggi dan terbaca */
        h1, h2, h3, h4, h5, h6, 
        .text-dark, .fw-bold, 
        .sidebar-brand, .user-profile .fw-bold { 
            color: var(--text-main) !important; 
        }

        p, span, small, 
        .text-muted, .stat-label, 
        .timeline-item p { 
            color: var(--text-muted) !important; 
        }
        
        /* Warna khusus teks penting */
        .text-primary { color: var(--accent-blue) !important; }
        .text-success { color: var(--accent-green) !important; }
        .text-purple { color: var(--accent-purple) !important; }

        /* =========================================
           SIDEBAR STYLING
           ========================================= */
        .sidebar { 
            width: 260px; 
            background-color: var(--bg-panel); 
            min-height: 100vh; 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column;
        }
        .sidebar-brand { 
            font-weight: 800; font-size: 1.1rem; padding: 20px; 
            border-bottom: 1px solid var(--border-color); 
            letter-spacing: 0.5px;
        }
        .user-profile { 
            padding: 15px 20px; display: flex; align-items: center; 
            border-bottom: 1px solid var(--border-color); 
        }
        .user-profile img { 
            width: 42px; height: 42px; border-radius: 50%; 
            object-fit: cover; margin-right: 12px;
            border: 2px solid var(--accent-blue);
        }
        
        .sidebar-scroll { flex-grow: 1; overflow-y: auto; }
        
        .nav-link { 
            color: var(--text-muted); padding: 10px 20px; font-weight: 500; 
            display: flex; align-items: center; justify-content: space-between; text-decoration: none;
        }
        .nav-link:hover { 
            color: var(--accent-blue); background-color: rgba(56, 189, 248, 0.08); 
        }
        .nav-link i.main-icon { width: 25px; color: var(--text-muted); }
        .nav-link:hover i.main-icon { color: var(--accent-blue); }
        
        .nav-link.active { 
            background-color: rgba(56, 189, 248, 0.15); 
            color: var(--accent-blue) !important; 
            border-radius: 8px; margin: 0 12px; padding: 10px 14px; 
            width: calc(100% - 24px);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .nav-link.active i.main-icon { color: var(--accent-blue); }

        /* =========================================
           MAIN CONTENT & CARDS
           ========================================= */
        .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 25px 40px; }
        
        .custom-card { 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            background: var(--bg-panel) !important; 
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        
        /* Form & Input Clean Dark */
        .form-control, .form-select {
            background-color: var(--bg-body);
            border-color: var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--bg-body);
            border-color: var(--accent-blue);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .form-control::placeholder { color: #9ca3af; }

        /* =========================================
           STAT CARDS & BADGES
           ========================================= */
        .stat-value { font-size: 1.8rem; font-weight: 800; }
        .icon-box { 
            width: 48px; height: 48px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem; 
        }
        
        /* Kotak ikon dengan warna latar solid yang tidak pudar */
        .bg-light-green { background-color: rgba(52, 211, 153, 0.2); color: var(--accent-green); }
        .bg-light-blue  { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        
        .bg-purple { background-color: var(--accent-purple); color: #111827 !important; font-weight: bold; }
        .version-pill { background-color: var(--accent-purple); color: #111827 !important; font-weight: bold; border-radius: 15px; padding: 4px 12px; font-size: 0.8rem;}
        
        .status-card { border-left: 4px solid var(--accent-blue); }
        .changelog-card { border-left: 4px solid var(--accent-purple); }
        
        .timeline-item { border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .timeline-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body class="d-flex">

    {% include 'sidebar.html' %}

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
